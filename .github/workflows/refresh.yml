name: publish latest Wolfi glibc
on:
  schedule:
    - cron: '7-57/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-latest-wolfi
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 -m venv build/venv
          build/venv/bin/pip install -r requirements.txt
          build/venv/bin/python -m unittest discover -s tests -p test_repository_migration.py
      - name: Migrate published history to apk/glibc before discovery
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          build/venv/bin/python scripts/migrate-repository.py
  discover:
    needs: migrate
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # GitHub requires push access to discover recoverable draft releases.
    permissions:
      contents: write
    outputs:
      state: ${{ steps.check.outputs.state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          aws --version
          openssl version
          python3 -m venv build/venv
          build/venv/bin/pip install -r requirements.txt
          build/venv/bin/python scripts/refresh.py
          make PYTHON=build/venv/bin/python check
          tar -czf build/wolfi-inputs.tar.gz -C build/inputs .
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/venv/bin/python scripts/publish.py status
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.check.outputs.state != 'complete'
        with:
          name: wolfi-inputs
          path: build/wolfi-inputs.tar.gz
          if-no-files-found: error
  build:
    needs: discover
    if: needs.discover.outputs.state == 'build'
    uses: ./.github/workflows/build.yml
    with:
      inputs_artifact: wolfi-inputs
      production: true
    secrets: inherit
  publish:
    needs: [discover, build]
    if: >-
      always() && !cancelled() && needs.discover.result == 'success' &&
      (needs.build.result == 'success' || needs.discover.outputs.state == 'publish')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          python3 -m venv build/venv
          build/venv/bin/pip install -r requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wolfi-inputs
          path: build/input-bundle
      - name: Restore captured inputs with their file modes
        run: |
          mkdir -p build/inputs
          tar -xzf build/input-bundle/wolfi-inputs.tar.gz -C build/inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build.result == 'success'
        with:
          pattern: glibc-*
          path: artifacts
      - name: Stage a recoverable draft from both successful builds
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: build/venv/bin/python scripts/publish.py stage
      - name: Write production signing key for the stable index
        env:
          GLIBC_APK_SIGNING_KEY: ${{ secrets.WEREWOLF_PACKAGES_KEY }}
        run: |
          test -n "$GLIBC_APK_SIGNING_KEY"
          build/venv/bin/python scripts/signing-key.py
      - name: Publish signed APK repositories and complete GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          build/venv/bin/python scripts/publish.py publish
