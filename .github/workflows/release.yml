name: release
on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: glibc-neutered-*
          path: artifacts
      - name: Emit immutable candidate release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for arch in x86_64 aarch64; do
            dir="artifacts/glibc-neutered-$arch"
            test -f "$dir/SHA256SUMS"
            test -f "$dir/$arch/APKINDEX.tar.gz"
            (cd "$dir" && sha256sum -c SHA256SUMS)
            tar -czf "glibc-neutered-$arch.tar.gz" -C "$dir" .
          done
          sha256sum glibc-neutered-*.tar.gz > SHA256SUMS
          tag="candidate-$SOURCE_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" glibc-neutered-*.tar.gz SHA256SUMS --target "$SOURCE_SHA" --prerelease --title "glibc-neutered candidate $SOURCE_SHA" --notes-file docs/release-notes.md
