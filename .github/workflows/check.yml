name: check
# Every pull request: the unit tests, then each package captured from Wolfi's
# newest stable recipe, verified, derived and patched (scripts/discover.py).
# Nothing is built or published, and GitHub is told nothing; build.yml builds
# one package by hand.
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools and run the unit tests
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y patch
          python3 -m venv build/venv
          build/venv/bin/pip install -r requirements.txt
          make PYTHON=build/venv/bin/python test
      - name: Capture, verify, derive and patch every package
        run: |
          set -o pipefail
          build/venv/bin/python scripts/discover.py --local | tee build/discover.log
          tail -1 build/discover.log | build/venv/bin/python -c 'import json, sys; failed = json.load(sys.stdin)["failed"]; sys.exit("stopped: " + ", ".join(failed) if failed else 0)'
