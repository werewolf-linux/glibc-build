name: build
# One package on both architectures: Melange builds it in bubblewrap, runs
# Wolfi's package tests and the package's own probe, and records provenance.
# By hand it captures Wolfi's newest recipe and signs with a throwaway key;
# refresh.yml calls it with the inputs discovery captured, signing for release.
on:
  workflow_dispatch:
    inputs:
      package:
        description: a directory under packages/
        type: string
        required: true
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      inputs_artifact:
        type: string
        default: ''
      production:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    concurrency:
      group: native-build-${{ github.event_name }}-${{ github.ref }}-${{ inputs.package }}-${{ matrix.arch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-26.04
          - arch: aarch64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.production && 'release' || 'ci' }}
    timeout-minutes: 300
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Name a package this repository builds
        run: test -f "packages/$PACKAGE/package.py"
      - name: Install build tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y bubblewrap python3-venv git make openssl patch
          python3 -m venv build/venv
          build/venv/bin/pip install -r requirements.txt
          python3 scripts/install-melange.py --dest build/tools/melange
          sudo python3 scripts/setup-runner.py
      - name: Check sandbox chroot before building
        run: |
          if ! sudo "$PWD/build/tools/bwrap" --ro-bind / / --dev /dev --proc /proc --unshare-pid \
              --cap-add CAP_SYS_CHROOT -- /usr/bin/python3 -c 'import os; os.chroot("/")'; then
            sudo journalctl -k --since '2 minutes ago' --no-pager
            exit 1
          fi
          sudo /usr/bin/bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid \
              --cap-add CAP_SYS_CHROOT -- /usr/bin/python3 -c '
          import errno, os
          try:
              os.chroot("/")
          except PermissionError as error:
              if error.errno != errno.EPERM:
                  raise
              print("runner: system bubblewrap still denies chroot")
          else:
              raise RuntimeError("system bubblewrap unexpectedly permits chroot")
          '
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.inputs_artifact != ''
        with:
          name: ${{ inputs.inputs_artifact }}
          path: build/input-bundle
      - name: Restore captured inputs with their file modes
        if: inputs.inputs_artifact != ''
        run: |
          mkdir -p "build/$PACKAGE/inputs"
          tar -xzf "build/input-bundle/$PACKAGE.tar.gz" -C "build/$PACKAGE/inputs"
      - name: Capture Wolfi's newest recipe for a build by hand
        if: inputs.inputs_artifact == ''
        run: build/venv/bin/python scripts/refresh.py "$PACKAGE"
      - name: Verify provenance and derivation
        run: make PYTHON=build/venv/bin/python PACKAGE="$PACKAGE" check derive
      - name: Apply every patch at the locked source
        run: make PYTHON=build/venv/bin/python PACKAGE="$PACKAGE" prepare
      - name: Write production signing key
        if: inputs.production
        env:
          PACKAGES_APK_SIGNING_KEY: ${{ secrets.WEREWOLF_PACKAGES_KEY }}
        run: |
          test -n "$PACKAGES_APK_SIGNING_KEY"
          build/venv/bin/python scripts/signing-key.py
      - name: Build and test signed packages
        run: |
          set -o pipefail
          sudo env PATH="$PWD/build/tools:$PATH" make PYTHON=build/venv/bin/python PACKAGE="$PACKAGE" \
            ARCH=${{ matrix.arch }} build 2>&1 | tee build/build.log
      - name: Record successful native validation
        run: |
          sudo chown -R "$USER" "build/$PACKAGE/packages"
          build/venv/bin/python scripts/provenance.py "$PACKAGE" --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ${{ inputs.package }}-${{ matrix.arch }}
          path: build/${{ inputs.package }}/packages/
          if-no-files-found: warn
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-${{ inputs.package }}-${{ matrix.arch }}
          path: |
            build/build.log
            build/${{ inputs.package }}/inputs/upstream.lock.json
            build/${{ inputs.package }}/${{ inputs.package }}.yaml
          if-no-files-found: warn
